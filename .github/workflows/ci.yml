name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Run tests
        run: vendor/bin/pest

  phar:
    name: Build phar
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          # --version に git describe の結果を入れるため、タグも含めて取得する
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          # 動作要件の下限でビルドする
          php-version: '8.2'
          extensions: openssl, mbstring
          ini-values: phar.readonly=0
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Build
        run: composer build-phar

      - name: Smoke test
        env:
          AWS_ENDPOINT_URL_COGNITO_IDENTITY_PROVIDER: http://127.0.0.1:9229
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          MINICOG_FIXED_CODE: '123456'
        run: |
          php build/minicog.phar --version
          cd "$RUNNER_TEMP"
          php "$GITHUB_WORKSPACE/build/minicog.phar" --listen 127.0.0.1:9229 > minicog.log 2>&1 &
          trap 'cat minicog.log' EXIT
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:9229/health
          curl --silent --show-error --fail --output /dev/null http://127.0.0.1:9229/admin/users
          jwks=$(curl --silent --show-error --fail http://127.0.0.1:9229/ap-northeast-1_minicog/.well-known/jwks.json)
          grep -q '"kty":"RSA"' <<< "$jwks"
          aws cognito-idp sign-up --client-id ci --username alice --password password123 \
            --user-attributes Name=email,Value=alice@example.com
          aws cognito-idp confirm-sign-up --client-id ci --username alice --confirmation-code 123456
          token_type=$(aws cognito-idp initiate-auth --client-id ci --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters USERNAME=alice,PASSWORD=password123 \
            --query AuthenticationResult.TokenType --output text)
          test "$token_type" = Bearer
          test -f minicog-data.json

      - uses: actions/upload-artifact@v7
        with:
          name: minicog.phar
          path: build/minicog.phar
          if-no-files-found: error

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --tag minicog:ci .

      - name: Smoke test
        run: |
          docker run --detach --name minicog --publish 9229:9229 minicog:ci
          trap 'docker logs minicog' EXIT
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' minicog)
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$status" = healthy
          curl --silent --show-error --fail --output /dev/null http://localhost:9229/admin/users
          discovery=$(curl --silent --show-error --fail http://localhost:9229/ap-northeast-1_minicog/.well-known/openid-configuration)
          grep -q '"issuer":"http://localhost:9229/ap-northeast-1_minicog"' <<< "$discovery"
